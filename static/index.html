<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>移民案件期限与材料管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 1080px; margin: auto; }
    button { padding: .45rem .8rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: .75rem; }
    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.25rem; }
    .panel { border: 1px solid #dde3ea; border-radius: 10px; padding: 1rem; }
    .panel h2 { margin: 0 0 .75rem; font-size: 1.05rem; }
    .record { border: 1px solid #dde3ea; border-radius: 8px; padding: .6rem .75rem; margin-bottom: .5rem; cursor: pointer; }
    .record:hover, .record.active { background: #eef4ff; border-color: #5b8def; }
    .badge { display: inline-block; font-size: .72rem; padding: .1rem .45rem; border-radius: 999px; background: #e7edf5; }
    .badge.paused { background: #fdeecb; color: #8a6100; }
    .badge.overdue { background: #fadcdc; color: #a02323; }
    table { border-collapse: collapse; width: 100%; font-size: .88rem; }
    td, th { border: 1px solid #e3e8ef; padding: .35rem .55rem; text-align: left; vertical-align: top; }
    th { background: #f4f6f8; }
    form { display: grid; gap: .5rem; margin-top: .75rem; padding-top: .75rem; border-top: 1px dashed #dde3ea; }
    form label { font-size: .82rem; display: flex; flex-direction: column; gap: .2rem; }
    input, textarea { padding: .4rem; border: 1px solid #c7cfd9; border-radius: 6px; font: inherit; }
    .check { flex-direction: row !important; align-items: center; }
    .muted { color: #66717e; font-size: .82rem; }
    .timeline li { margin-bottom: .5rem; }
  </style>
</head>
<body>
<main>
  <h1>移民案件期限与材料管理</h1>
  <div class="row">
    <button id="load">加载记录</button>
    <button id="stats">查看状态统计</button>
    <span class="muted">补件停表：暂停时冻结剩余天数，等待期不算逾期；回应后按剩余天数重算期限；撤回须主管写原因并恢复原期限。</span>
  </div>
  <pre id="output" hidden></pre>
  <div class="layout">
    <section class="panel">
      <h2>案件列表</h2>
      <div id="list" class="muted">点击“加载记录”。</div>
    </section>
    <section class="panel">
      <h2>案件详情</h2>
      <div id="detail" class="muted">选择左侧案件查看停表前后、补件截止日和审计时间线。</div>
    </section>
  </div>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo","Content-Type":"application/json"};
let selectedId = null;
let selectedVersion = null;

async function api(path, options) {
  const response = await fetch(path, options || {headers});
  const data = await response.json();
  if (!response.ok) throw new Error((data && data.message) || ("HTTP " + response.status));
  return data;
}

function esc(value) {
  const span = document.createElement("span");
  span.textContent = value == null ? "—" : String(value);
  return span.innerHTML;
}

async function loadRecords() {
  const data = await api("/api/records?limit=50");
  const box = document.getElementById("list");
  if (!data.items.length) { box.innerHTML = '<span class="muted">暂无记录</span>'; return; }
  box.innerHTML = "";
  data.items.forEach(r => {
    const p = r.payload || {};
    const badges = [`<span class="badge">${esc(r.state)}</span>`];
    if (p.clock_paused) badges.push('<span class="badge paused">停表中</span>');
    if (p.overdue) badges.push('<span class="badge overdue">逾期</span>');
    const div = document.createElement("div");
    div.className = "record" + (r.id === selectedId ? " active" : "");
    div.innerHTML = `<div><strong>#${r.id} ${esc(r.reference)}</strong></div>
      <div class="muted">期限第 ${esc(p.deadline_day)} 天 · 剩余 ${esc(p.days_remaining)} 天</div>
      <div>${badges.join(" ")}</div>`;
    div.onclick = () => selectRecord(r.id);
    box.appendChild(div);
  });
}

function kvTable(rows) {
  return "<table><tbody>" + rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`).join("") + "</tbody></table>";
}

function stoppagesTable(stoppages) {
  if (!stoppages || !stoppages.length) return "";
  const head = "<tr><th>请求日</th><th>停表开始</th><th>补件截止日</th><th>恢复日</th><th>结束方式</th><th>停前期限</th><th>恢复后期限</th><th>恢复原因</th></tr>";
  const body = stoppages.map(s => `<tr>
    <td>${esc(s.request_day)}</td><td>${esc(s.pause_start_day)}</td><td>${esc(s.evidence_due_day)}</td>
    <td>${esc(s.resume_day)}</td><td>${s.ended_by === "withdraw" ? "主管撤回" : "申请人回应"}</td>
    <td>${esc(s.deadline_before_pause)}</td><td>${esc(s.deadline_after_resume)}</td>
    <td>${esc(s.withdraw_reason || "")}</td></tr>`).join("");
  return `<h3>停表区间</h3><table>${head}${body}</table>`;
}

function timelineHtml(items) {
  return `<h3>审计时间线</h3><ul class="timeline">` + items.map(e => {
    const c = (e.details && e.details.clock) || {};
    let clockLine = "";
    if (Object.keys(c).length) {
      const parts = [];
      if ("deadline_before_pause" in c) parts.push(`停前期限 ${esc(c.deadline_before_pause)}`);
      if ("deadline_after_resume" in c) parts.push(`恢复后期限 ${esc(c.deadline_after_resume)}`);
      if ("deadline_restored" in c) parts.push(`恢复原期限 ${esc(c.deadline_restored)}`);
      if ("evidence_due_day" in c) parts.push(`补件截止日 ${esc(c.evidence_due_day)}`);
      if ("pause_start_day" in c) parts.push(`停表开始 ${esc(c.pause_start_day)}`);
      if ("resume_day" in c) parts.push(`恢复日 ${esc(c.resume_day)}`);
      if ("withdraw_day" in c) parts.push(`撤回日 ${esc(c.withdraw_day)}`);
      if (c.withdraw_reason) parts.push(`恢复原因：${esc(c.withdraw_reason)}`);
      if ("remaining_days_frozen" in c) parts.push(`冻结剩余 ${esc(c.remaining_days_frozen)}`);
      clockLine = `<div class="muted">${parts.join(" · ")}</div>`;
    }
    return `<li><strong>${esc(e.action)}</strong> <span class="muted">v${esc(e.version)} · ${esc(e.actor_id)}</span>
      <div>${esc(e.details && e.details.summary)}</div>${clockLine}</li>`;
  }).join("") + "</ul>";
}

function actionForms(state) {
  if (state === "submitted") {
    return `<form id="f-request">
      <h3>发出补件要求（专员）</h3>
      <label>请求日 <input name="evidence_request_day" type="number" required></label>
      <label>补件天数 <input name="allowed_days" type="number" value="10" min="1" required></label>
      <label>补件内容 <input name="evidence_request" placeholder="需补充的材料" required></label>
      <label class="check"><input type="checkbox" name="pause_clock" checked> 暂停案件期限（停表，保留剩余天数）</label>
      <button type="submit">发起补件</button>
    </form>`;
  }
  if (state === "evidence_requested") {
    return `<form id="f-respond">
      <h3>申请人回应（按剩余天数重算新期限）</h3>
      <label>回应日 <input name="response_day" type="number" required></label>
      <label>提交材料（逗号分隔）<input name="documents" required></label>
      <button type="submit">回应补件</button>
    </form>
    <form id="f-withdraw">
      <h3>撤回补件（主管，恢复原期限）</h3>
      <label>撤回日 <input name="withdraw_day" type="number" required></label>
      <label>撤回/恢复原因 <textarea name="withdraw_reason" required></textarea></label>
      <button type="submit">主管撤回</button>
    </form>`;
  }
  return '<p class="muted">当前状态没有可演示的停表操作。</p>';
}

async function selectRecord(id) {
  selectedId = id;
  const [r, timeline] = await Promise.all([
    api("/api/records/" + id),
    api("/api/records/" + id + "/audit")
  ]);
  selectedVersion = r.version;
  const p = r.payload || {};
  const badges = [`<span class="badge">${esc(r.state)}</span>`];
  if (p.clock_paused) badges.push('<span class="badge paused">停表中</span>');
  if (p.overdue) badges.push('<span class="badge overdue">逾期</span>');
  const rows = [
    ["引用编号", esc(r.reference)],
    ["状态", badges.join(" ")],
    ["补件请求日", esc(p.evidence_request_day)],
    ["补件截止日", esc(p.evidence_due_day)],
    ["停表前原期限", esc(p.deadline_day_before_pause)],
    ["当前期限", esc(p.deadline_day)],
    ["冻结/当前剩余天数", esc(p.clock_paused ? p.remaining_days_at_pause : p.days_remaining)],
    ["等待期是否逾期", p.clock_paused ? "否（停表中）" : (p.overdue ? "是" : "否")],
  ];
  document.getElementById("detail").innerHTML =
    kvTable(rows) + stoppagesTable(p.clock_stoppages) + timelineHtml(timeline.items) + actionForms(r.state);
  bindForms();
  loadRecords();
}

function bindForms() {
  const postAction = (action, data) =>
    api(`/api/records/${selectedId}/actions/${action}`, {method: "POST", headers, body: JSON.stringify({expected_version: selectedVersion, data})})
      .then(() => selectRecord(selectedId))
      .catch(err => alert(err.message));

  const f1 = document.getElementById("f-request");
  if (f1) f1.onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(f1);
    return postAction("request_evidence", {
      evidence_request_day: Number(fd.get("evidence_request_day")),
      allowed_days: Number(fd.get("allowed_days")),
      evidence_request: fd.get("evidence_request"),
      pause_clock: fd.get("pause_clock") === "on"
    });
  };
  const f2 = document.getElementById("f-respond");
  if (f2) f2.onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(f2);
    return postAction("respond", {response_day: Number(fd.get("response_day")), documents: fd.get("documents").split(",").map(s => s.trim()).filter(Boolean)});
  };
  const f3 = document.getElementById("f-withdraw");
  if (f3) f3.onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(f3);
    return postAction("withdraw_evidence", {withdraw_day: Number(fd.get("withdraw_day")), withdraw_reason: fd.get("withdraw_reason")});
  };
}

document.getElementById("load").onclick = () => loadRecords().catch(err => alert(err.message));
document.getElementById("stats").onclick = async () => {
  const data = await api("/api/stats");
  const out = document.getElementById("output");
  out.hidden = false;
  out.textContent = JSON.stringify(data, null, 2);
};
</script>
</body>
</html>
